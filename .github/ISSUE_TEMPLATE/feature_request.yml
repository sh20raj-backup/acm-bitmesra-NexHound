name: Feature request
description: Propose a focused new diagnostic or improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Who is this for, and what task is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Network, security, and privacy implications
      description: What data is accessed or transmitted? What permissions are needed?
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and setup cost
      description: Explain why standard-library or existing functionality is insufficient.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true
